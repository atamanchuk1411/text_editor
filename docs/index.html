<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=0.1, maximum-scale=2.0, minimum-scale=1.0">
    <title>text editor</title>
    <script type="module" crossorigin src="./assets/js/main.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/js/app.js">
    <link rel="stylesheet" crossorigin href="./assets/styles.css">
  </head>
  <body> 
    <div class="content" contenteditable="true" id="content"></div>
    <div class="editor">
      <button class="bold" type="button" id="bold">B</button>
      <button class="italic" type="button" id="italic">I</button>
      <input type="range" id="text" min="10" max="50" value="16">
      <input class="color" type="color" id="color" value="#121212">
      <button class="left" type="button" id="left"><span class="small"> </span><span class="big"></span><span class="small"> </span><span class="big"></span></button>
      <button class="center" type="button" id="center"><span class="small"> </span><span class="big"></span><span class="small"> </span><span class="big"></span></button>
      <button class="right" type="button" id="right"><span class="small"> </span><span class="big"></span><span class="small"> </span><span class="big"></span></button>
    </div>
  </body>
</html>
